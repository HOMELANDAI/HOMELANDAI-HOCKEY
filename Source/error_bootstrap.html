<script>window.addEventListener('error',function(e){if(!e.message)return;document.getElementById('errorText').textContent=e.message;document.getElementById('error').hidden=false;});window.frozenPawsError=function(e){document.getElementById('errorText').textContent=String(e);document.getElementById('error').hidden=false;};window.addEventListener('unhandledrejection',function(e){window.frozenPawsError(e.reason);});</script>
